schema_version: "2.0"

task_id: "a4"
task_name: "A4 用户需求与痛点分析"
indicator_description: >
  能够深入分析工程问题所涉及的最终用户、利益相关者及其使用情境，识别显性与隐性需求，
  精准定位其面临的核心痛点与关键挑战。关注AI辅助编制的解决方案如何与人的工作流程、
  决策习惯和组织文化相契合。并基于核心需求定义与特定场景相适配的成功评价标准。

scale:
  type: "ordinal"
  min: 1
  max: 5
  levels:
    5: "优秀"
    4: "良好"
    3: "合格"
    2: "接近合格"
    1: "待改进"

dimensions:
  - code: "A4-1"
    name: "用户群体识别的全面性"
    anchors:
      5: >
        在AI（用户画像AI、同理心地图AI、市场分析AI等）支持下，能识别≥3类差异显著的老年用户
        和关键相关方（如独居、失能、活跃学习、照护者、平台运营方等）；能结合AI输出与自己的
        调研结果，区分不同群体在身体状况、数字素养、经济条件、情感需求等方面的情境差异与约束
        条件；能指出不同群体之间需求冲突或权衡点，体现对复杂情境的整体把握。
      4: >
        能识别2-3类主要老年用户或利益相关方，并在AI辅助下对其基本特征和使用情境做出区分；
        能说明部分群体间的差异，但对需求冲突、使用障碍等的分析不够系统。
      3: >
        主要识别出1-2类典型用户，描述集中在表层特征（年龄、是否会用手机等）；有使用AI工具，
        但更多是被动接受结果，对不同群体的差异和情境缺乏深入分析。
      2: >
        开始尝试区分少量用户或相关方，但仍主要停留在表层特征描述；会参考AI输出，但对不同
        群体的差异、约束和潜在冲突分析仍较薄弱。
      1: >
        基本只提到"老年人"这一笼统群体，缺乏细分或遗漏关键利益相关方；很少或没有结合AI工具，
        仅停留在经验性、口号式描述。

  - code: "A4-2"
    name: "痛点定位与需求精准度"
    anchors:
      5: >
        能在AI辅助下，将老年用户的痛点与具体行为路径、情绪体验和环境约束建立清晰关联；对不同
        痛点进行优先级排序（如按严重程度、影响范围、可行性），并提出可操作、可验证的功能假设
        或设计方向；能识别并说明痛点背后潜在的系统性问题（如家庭支持、平台算法、服务流程等）。
      4: >
        痛点识别较为清晰，能结合AI输出举出多个具体例子；能初步说明痛点与功能的对应关系，有部分
        可落地的功能设想，但优先级和验证方式不够明确。
      3: >
        能根据AI或自身经验列出一些问题点，但多为表面抱怨（如"看不懂""不会用"）；痛点与功能
        方案的对应关系较弱，缺少数据或案例支撑，也未明确哪些是核心痛点。
      2: >
        能够提及一些用户问题，但多停留在表层抱怨或零散现象罗列；对AI结果有初步参考，但尚未
        形成明确的核心痛点、排序依据或可验证需求。
      1: >
        未能识别出有代表性的痛点，或停留在空泛表述（如"要提高用户体验"）；对AI给出的洞察
        基本照单全收，且缺乏任何进一步分析或功能推演。

  - code: "A4-3"
    name: "AI协同与伦理反思"
    anchors:
      5: >
        主动调用≥2类不同AI工具（如用户画像AI、同理心地图AI、市场分析AI），围绕同一需求问题
        发起多轮追问和交叉验证；能指出AI在数据、刻板印象、语言表述等方面可能产生的偏见或误导，
        并提出规避或修正的办法；在报告中体现对隐私保护、信息透明、使用门槛等伦理问题的反思，
        并将其落实为具体需求或设计约束。
      4: >
        能较好地利用1-2种AI工具，进行一定深度的需求探索；能意识到部分AI输出可能不准确或不适用
        于老年群体，并做简单的筛选或修正；提到隐私、安全等伦理点，但多停留在原则层面，措施不
        够具体。
      3: >
        偶尔调用AI，主要是单轮问答，对结果被动接受，缺少追问和比较；伦理相关内容以口号为主
        （如"注意隐私"），未结合具体使用情境展开。
      2: >
        会调用AI辅助思考，但大多停留在单轮提问或直接采纳结果；能提到少量伦理风险词汇，但尚未
        结合具体使用情境形成明确约束或修正办法。
      1: >
        基本不使用AI或仅仅作为生成文案工具，没有实质性的协同分析过程；完全忽视隐私、公平、
        误导等伦理问题，或将风险转嫁给用户而不作承担与改进。