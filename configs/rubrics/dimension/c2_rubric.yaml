schema_version: "2.0"

dim_id: "c2"
dim_name: "C2 潜在风险识别与应对策略"
indicator_description: >
  在项目实施前和过程中，系统地识别可能对项目产生负面影响的不确定性因素，并针对已识别的
  潜在风险（包括AI相关风险），制定预防性或应急性的计划和措施。关注与AI模型失效、
  数据质量问题、算法偏见、安全风险、技术依赖等相关的风险。

scale:
  type: "ordinal"
  min: 1
  max: 5
  levels:
    5: "优秀"
    4: "良好"
    3: "合格"
    2: "接近合格"
    1: "待改进"

dimensions:
  - code: "C2-1"
    name: "风险识别全面性"
    anchors:
      5: >
        在AI支持下，能系统识别技术、数据与隐私、用户与运营、团队与管理、
        伦理与合规等多维风险，并区分内外部因素；能指出复杂工程特有的耦合风险
        （如多系统联动导致的级联故障、AI决策与人工流程的错配等）；
        对AI自动生成的风险清单进行筛选、补充和本地化调整。
      4: >
        能识别3-4类主要风险类型（如技术、用户、伦理等），覆盖关键环节；
        在AI提示的基础上有少量扩展，但对风险之间的关联关系分析有限。
      3: >
        能列出若干显性问题（如“系统崩溃”“用户流失”等），但分类粗糙，
        多为表面问题；基本照搬AI生成的风险，没有明显的增删或重组。
      2: >
        能提到部分项目风险，并开始参考AI给出的风险清单，但覆盖面仍较窄；
        对关键风险的分类、本地化调整和关联分析还不清楚，容易停留在零散罗列。
      1: >
        遗漏关键风险（如隐私泄露、算法偏见、资源不足等），或仅列出与项目无关的泛泛风险；
        无AI协同或完全依赖AI给出的单一清单，缺乏自我审视。

  - code: "C2-2"
    name: "应对策略科学性"
    anchors:
      5: >
        能基于风险等级与触发条件，制定具体、可执行的预防与应急预案
        （包括责任人、时间节点、资源需求）；对关键风险提出替代路径或降级方案，
        并说明其对性能、成本、用户体验的影响；有效利用AI进行方案比选或模拟推演，
        同时对其假设前提进行说明和修正。
      4: >
        针对主要风险提出基本合理的应对措施，逻辑清晰，能体现“预防+应急”思路；
        能说明部分策略与风险等级的对应关系，但执行细节或资源安排仍不够具体。
      3: >
        对部分风险给出笼统策略（如“加强测试”“提高安全性”），缺乏操作层面的步骤；
        AI参与方案生成，但未对不同方案做系统比较，选择理由不够充分。
      2: >
        能意识到部分风险需要对应措施，也会参考AI生成的方案建议；
        但策略多停留在原则层面，缺少触发条件、执行步骤、责任分工或资源安排，
        与项目实际结合仍较弱。
      1: >
        大多数风险没有对应的应对策略，或策略明显不可行、脱离项目实际；
        完全依赖AI给出的一般性建议，没有针对自身项目情境进行调整。

  - code: "C2-3"
    name: "风险量化与监控"
    anchors:
      5: >
        能根据AI建议与行业经验，构建风险矩阵或评分模型，对概率、影响程度进行量化分级；
        为高风险项设置可监控的指标与阈值（如系统可用性、误报率、投诉率等），
        并设计监控频率与告警机制；明确使用AI或脚本自动监测的方案，并预留人工复核环节。
      4: >
        至少对关键风险进行定性分级（高、中、低），并尝试给出部分简单的量化指标；
        初步考虑到监控机制（如定期检查、日志审阅等），但触发条件和责任分工不够清楚。
      3: >
        有风险清单，但基本未量化，仅停留在“需要关注”“比较严重”等模糊表述；
        监控机制仅为简单口号（如“出现问题及时处理”），缺乏具体流程。
      2: >
        开始意识到风险需要跟踪或分级，也可能参考AI给出的矩阵或监控建议；
        但量化指标、阈值、监控流程和告警安排仍较模糊，难以形成可执行的持续监控。
      1: >
        没有任何风险跟踪、量化或监控安排；完全依赖上线后被动反馈，
        对AI或系统监控手段没有考虑。
