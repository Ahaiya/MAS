# 模型与运行参数的唯一来源。
#
# 密钥**值**不在这里——这里只写环境变量的名字（api_key_env），值放 .env。
# 变量名按厂商取而非按角色：凭证属于厂商账号，多个角色共用同一账号时
# 不必在 .env 里把同一个值抄好几遍。
#
# 每个条目的 model / api_base / api_key_env 都是必填，缺一即报错——没有任何
# 环境变量兜底，避免"漏填却静默跑了别的模型/别的厂商"。

providers:
  # 双链路评价的两个独立评委。两者刻意用不同厂商的模型，
  # 以免同源模型带来伪独立。
  rater_1:
    model: "deepseek-chat"
    api_base: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    params:
      temperature: 0.0

  rater_2:
    model: "glm-5.2"
    api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "DASHSCOPE_API_KEY"
    params:
      temperature: 0.0
      extra_body:
          enable_thinking: false

  # 仲裁评委：只在双链分歧时被调用。缺省整个条目也能启动，
  # 但真触发仲裁时会报错——不静默兜底。
  rater_3:
    model: "deepseek-chat"
    api_base: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    params:
      temperature: 0.0

  # 生成给学生看的文字反馈，温度略高以免措辞呆板。
  feedback:
    model: "deepseek-chat"
    api_base: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    params:
      temperature: 0.1

# 运行期旋钮，整段可省略，逐字段回落到默认值。
runtime:
  max_workers: 8            # 观测点级并发上限；按 LLM 服务档位调，避免 429
  timeout_seconds: 60       # 单次 LLM 调用的挂钟超时
  max_retries: 3            # 首次失败后的额外重试次数
  retry_delay_seconds: 1    # 重试间隔
  context_budget_tokens: 48000  # 数据包进模型的 token 上限；与上方 providers 的模型
                                # 上下文窗口耦合——换窗口更小的模型要一起调小。
                                # 注意：**当前没有任何代码消费它**。旧的「超预算从尾部
                                # 丢单元」逻辑随 segment.py 一并删除（那个做法本身不合理），
                                # 引擎侧的预算策略待重新设计，见 .scratch/parse-layer/spec.md
                                # 的 Out of Scope。
