# ASAP Set 8 Composite Aggregation Policy
# Source: docs/Adjudication_Rules.md
# This policy defines how to calculate total composite score

schema_version: "2.0"

aggregation_policy:
  policy_id: "asap_set8_composite"
  policy_version: "v1"
  policy_name: "ASAP Set 8 Composite Score Formula"
  description: "Composite score calculation using I, O, S traits at 2x weight and C at 4x weight"

  outputs:
    # Output 1: Individual trait scores (always produced)
    - output_id: "trait_scores"
      type: "dimension_scores"
      description: "Individual scores for all six traits"
      always_produce: true

    # Output 2: Composite score (conditional on resolution status)
    - output_id: "composite_score"
      type: "weighted_sum"
      description: "Total composite score using weighted formula"
      always_produce: true

  composite_formula:
    # Variant for essays WITHOUT resolution (use Rater 1 and Rater 2)
    - variant_id: "without_resolution"
      applies_when: "resolution_not_used"
      description: "Use average of Rater 1 and Rater 2 for each trait"
      source_raters: ["rater_1", "rater_2"]
      aggregation_method: "average_per_trait_then_weighted_sum"
      weights:
        ideas_content: 2
        organization: 2
        voice: 0
        word_choice: 0
        sentence_fluency: 2
        conventions: 4
      formula_representation: "(I_R1+I_R2)/2*2 + (O_R1+O_R2)/2*2 + (S_R1+S_R2)/2*2 + 2*(C_R1+C_R2)/2"

    # Variant for essays WITH resolution (use Rater 3)
    # aggregation_method 必须使用 average_per_trait_then_weighted_sum，
    # 这样 source_raters: ["rater_3"] 才会生效，从 hypotheses 列表中按
    # rater_id 查找 R3 分数。direct_weighted_sum 使用 FinalDimensionDecision.final_score，
    # 无法保证非冲突维度使用 R3 分数，不符合 ASAP Set 8 规定。
    - variant_id: "with_resolution"
      applies_when: "resolution_used"
      description: "Use Rater 3 scores exclusively for all composite dimensions"
      source_raters: ["rater_3"]
      aggregation_method: "average_per_trait_then_weighted_sum"
      weights:
        ideas_content: 2
        organization: 2
        voice: 0
        word_choice: 0
        sentence_fluency: 2
        conventions: 4
      formula_representation: "2*I_R3 + 2*O_R3 + 2*S_R3 + 4*C_R3 or 2*(I+O+S+C) + 2*C"

  notes:
    - "Voice and Word Choice are not included in composite calculation"
    - "Conventions carries double weight compared to I, O, and S"
    - "Formula uses only 4 of 6 traits for composite score"

  metadata:
    source_document: "docs/Adjudication_Rules.md"
    version_timestamp: "2026-03-12"
