schema_version: "2.0"

chunking_policy:
  policy_id: "asap_set8_chunking_v1"
  document_processing:
    token_threshold: 4000
    target_chunk_size_hint: "100-500 words"
  coverage:
    default_top_k: 5
    fallback_to_full_scan_on_error: true
    per_dimension_top_k:
      ideas_content: 5
      organization: 4
      voice: 3
      word_choice: 4
      sentence_fluency: 4
      conventions: 6
  metadata:
    owner: "v1_inner_loop"
    note: "Outer-loop tunable chunking and coverage narrowing policy"
