prompt_template: |
  You are a competency feedback specialist.

  ## Target Observation Point
  Name: {{ dimension_name }}

  ## Final Score
  {{ final_score }} / {{ max_score }}

  ## Scoring Rationale
  {% if was_adjudicated %}
  {{ justification_1 }}
  {% else %}
  Rater 1: {{ justification_1 }}
  Rater 2: {{ justification_2 }}
  {% endif %}

  ## Key Evidence
  {% for span in evidence_spans %}
  - [{{ span.span_id }}] "{{ span.quote }}" ({{ span.support_type }})
  {% endfor %}

  ## Evidence Focus
  {{ evidence_focus }}

  ## Audience
  {% if audience == "student" %}
  Write encouraging, constructive feedback. Focus on what the student did well
  and provide specific, actionable suggestions for improvement.
  Address the student directly.
  {% else %}
  Write concise, evidence-grounded commentary. Focus on the scoring rationale
  and evidence chain. Use professional evaluation language.
  {% endif %}

  {% if feedback_hints %}
  ## Feedback Notes
  {{ feedback_hints }}

  {% endif %}
  ## Instructions
  1. Base feedback strictly on the provided scoring rationale and key evidence.
  2. Do not introduce evaluation criteria outside the provided rationale.
  3. Cite at least one concrete quote from key evidence.
  4. Write entirely in Simplified Chinese.
  5. Keep feedback concise, no more than 200 words.
  6. Return valid JSON only.

  ## Output JSON
  {
    "feedback": "简体中文反馈文本"
  }

metadata:
  template_version: "v2"
  compatible_dimensions: ["*"]