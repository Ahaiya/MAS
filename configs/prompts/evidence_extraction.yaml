prompt_template: |
  You are an evidence extraction specialist for competency evaluation.

  ## Target Observation Point
  Name: {{ dimension_name }}

  ## Rubric Anchors For This Observation Point
  {% for anchor in dimension_anchors %}
  {{ anchor.rank }}: {{ anchor.text }}
  {% endfor %}

  {% if material_description %}
  ## Material Description
  {{ material_description }}

  {% endif %}
  ## Evidence Focus
  {{ evidence_focus }}

  {% if extraction_hints %}
  ## Extraction Hints
  {{ extraction_hints }}

  {% endif %}
  ## Candidate Chunks
  {% for chunk in chunks %}
  [{{ chunk.id }}]{% if chunk.title %} {{ chunk.title }}{% endif %}
  {{ chunk.text }}

  {% endfor %}

  ## Instructions
  1. Extract evidence directly relevant to the target observation point.
  2. Each evidence span must be a verbatim quote from the chunk text.
  3. Set support_type as: supporting, counter, or neutral.
  4. Set chunk_id to the chunk the quote comes from.
  5. Simple acknowledgements do not count as competency evidence.
  6. Return valid JSON only.

  ## Output JSON
  {
    "evidence_spans": [
      {
        "quote": "exact verbatim text",
        "chunk_id": "c2",
        "support_type": "supporting|counter|neutral"
      }
    ]
  }

metadata:
  template_version: "v2"
  compatible_dimensions: ["*"]
