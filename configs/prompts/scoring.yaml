prompt_template: |
  {{ role_description }}

  Your task is to score the writing trait: {{ dimension_name }} ({{ dimension_code }}).
  You must score only from the structured evidence below. Do not use any outside
  assumptions or essay content that is not present in this prompt.

  ## Rubric Levels
  {% for level in levels %}
  **Score {{ level.rank }}: {{ level.summary }}**
  {% for descriptor in level.descriptors %}
  - {{ descriptor }}
  {% endfor %}

  {% endfor %}

  ## Facet Evidence
  {% for facet in facet_evidence %}
  ### Facet: {{ facet.facet_id }}
  Supporting evidence:
  {% if facet.supporting %}
  {% for item in facet.supporting %}
  - [{{ item.span_id }}] "{{ item.quote }}"
  {% endfor %}
  {% else %}
  - (none)
  {% endif %}

  Counter evidence:
  {% if facet.counter %}
  {% for item in facet.counter %}
  - [{{ item.span_id }}] "{{ item.quote }}"
  {% endfor %}
  {% else %}
  - (none)
  {% endif %}

  Finding note: {{ facet.finding_note }}

  {% endfor %}

  ## Observation Confidence
  {{ observation_confidence }}
  {% if uncertainty_notes %}
  Uncertainty notes:
  {% for note in uncertainty_notes %}
  - {{ note }}
  {% endfor %}
  {% endif %}

  {% if score_anchors %}
  ## Dimension-Specific Score Anchors
  {% for anchor in score_anchors %}
  - {{ anchor.title }} (anchor target {{ anchor.target_score }}, this dimension {{ anchor.dimension_score }}): {{ anchor.note }}
  {% endfor %}
  {% endif %}

  {% if dataset_notes %}
  {{ dataset_notes }}
  {% endif %}

  {% if calibration_notes %}
  {{ calibration_notes }}
  {% endif %}

  {% if dimension_override_notes %}
  ## Dimension Override
  {{ dimension_override_notes }}
  {% endif %}

  ## Instructions
  1. Score only from the provided facet evidence and rubric descriptors.
  2. Do not cite or infer evidence that is not explicitly listed in Facet Evidence.
  3. If any facet has no supporting and no counter evidence, explicitly state:
     "insufficient evidence for facet <facet_id>" in justification.
  4. If `observation_confidence` is LOW, reduce your own confidence and explain
     the uncertainty source in justification.
  5. Keep justification concise and tie it directly to descriptor_refs + evidence_ids.
  6. Return exactly one JSON object with no Markdown fences, no preamble, and no trailing notes.
  7. Keep `descriptor_refs` to at most 3 items and `evidence_ids` to at most 4 decisive spans.
  8. Keep `justification` short and concrete, ideally no more than 80 words.

  ## Output Format (JSON)
  {
    "proposed_score": integer,
    "descriptor_refs": ["exact text of relevant descriptors"],
    "evidence_ids": ["span-01", "span-03"],
    "confidence": float,
    "justification": "brief explanation linking score to descriptors and evidence"
  }

metadata:
  template_version: "v3"
  compatible_dimensions: ["*"]
