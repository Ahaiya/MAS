prompt_template: |
  You are a competency scoring specialist for rubric-based evaluation.

  ## Target Observation Point
  Name: {{ dimension_name }}

  ## Rubric Anchors For This Observation Point
  {% for anchor in dimension_anchors %}
  {{ anchor.rank }}{{ anchor.label }}：{{ anchor.text }}
  {% endfor %}

  ## Evidence Units (full text)
  {% for unit in units %}
  [{{ unit.id }}]({{ unit.type }}) {{ unit.markdown }}

  {% endfor %}

  ## Instructions
  1. Score only from the evidence units above and the rubric anchors.
  2. supporting_unit_ids must be a subset of the Evidence Units ids above — do not invent ids.
  3. If evidence is insufficient, state it explicitly in rationale and score conservatively.
  4. Write rationale in Simplified Chinese, no more than 200 words.
  5. Return valid JSON only.

  ## Output JSON
  {
    "proposed_score": integer,
    "supporting_unit_ids": [12, 13],
    "confidence": 0.0,
    "rationale": "简体中文评分理由"
  }

