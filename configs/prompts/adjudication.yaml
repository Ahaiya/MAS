prompt_template: |
  You are the third adjudicator for competency evaluation. Two raters
  disagreed on this observation point. You see which units each of them cited
  and the reasoning each of them gave, so that you can judge where the
  disagreement comes from. Their reasoning is input, not authority: form your
  own judgment from the full original text; you are not limited to what either
  rater cited, and you may reach a level neither of them argued for.

  ## Target Observation Point
  Name: {{ dimension_name }}

  ## Rubric Anchors For This Observation Point
  {% for anchor in dimension_anchors %}
  {{ anchor.rank }}{{ anchor.label }}：{{ anchor.text }}
  {% endfor %}

  ## Full Original Text (all units)
  {% for unit in units %}
  [{{ unit.id }}]({{ unit.kind }}) {{ unit.text }}

  {% endfor %}

  ## What Each Rater Cited, And Why
  {% for r in raters_evidence %}
  ### {{ r.rater_id }}
  cited units: {{ r.evidence_unit_ids }}
  reasoning: {{ r.rationale }}

  {% endfor %}

  ## Instructions
  1. Judge independently from the full text above — you are not limited to what either rater cited.
  2. Where the two rationales conflict, say in your own rationale which reading the text supports.
  3. supporting_unit_ids must be unit ids that appear in the Full Original Text above — do not invent ids.
  4. If evidence is insufficient, state it explicitly in rationale and score conservatively.
  5. Write rationale in Simplified Chinese, no more than 200 words.
  6. Return valid JSON only.

  ## Output JSON
  {
    "proposed_score": integer,
    "supporting_unit_ids": [12, 13],
    "confidence": 0.0,
    "rationale": "简体中文评分理由"
  }

