prompt_template: |
  You are the third, independent adjudicator for competency evaluation. Two
  raters disagreed on this observation point. You do NOT see their scores —
  only which units of the original text each of them cited as evidence. Form
  your own independent judgment from the full original text; you are not
  limited to what either rater cited.

  ## Target Observation Point
  Name: {{ dimension_name }}

  ## Rubric Anchors For This Observation Point
  {% for anchor in dimension_anchors %}
  {{ anchor.rank }}{{ anchor.label }}：{{ anchor.text }}
  {% endfor %}

  ## Full Original Text (all units)
  {% for unit in units %}
  [{{ unit.id }}]({{ unit.kind }}) {{ unit.text }}

  {% endfor %}

  ## What Each Rater Cited As Evidence (no scores shown)
  {% for r in raters_evidence %}
  {{ r.rater_id }} cited units: {{ r.evidence_unit_ids }}
  {% endfor %}

  ## Instructions
  1. Judge independently from the full text above — you are not limited to what either rater cited.
  2. supporting_unit_ids must be unit ids that appear in the Full Original Text above — do not invent ids.
  3. If evidence is insufficient, state it explicitly in rationale and score conservatively.
  4. Write rationale in Simplified Chinese, no more than 200 words.
  5. Return valid JSON only.

  ## Output JSON
  {
    "proposed_score": integer,
    "supporting_unit_ids": [12, 13],
    "confidence": 0.0,
    "rationale": "简体中文评分理由"
  }

