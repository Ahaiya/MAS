# ASAP Set 8 Default Adjudication Policy
# Source: docs/Adjudication_Rules.md
# This policy defines when to invoke a third rater and how to resolve conflicts

schema_version: "2.0"

adjudication_policy:
  policy_id: "asap_set8_default_adjudication"
  policy_version: "v1"
  policy_name: "ASAP Set 8 Default Double/Triple Score Resolution"
  description: "Default adjudication policy for ASAP Set 8 with non-adjacency, cusp, and adjacent-drift rules"

  raters:
    required_independent_scores: 2
    rater_labels:
      - "rater_1"
      - "rater_2"
    optional_resolution_rater: 1
    resolution_rater_label: "rater_3"

  triggers:
    # Trigger 1: Non-Adjacent Rule
    # If |score_rater_1 - score_rater_2| > 1 on any trait, invoke resolution
    - trigger_id: "non_adjacent_trait_scores"
      type: "score_distance"
      applies_to_dimensions: ["*"]
      description: "Non-adjacency between 1st and 2nd scorer generates resolution read"
      threshold:
        operator: ">"
        value: 1
      action: "invoke_resolution"
      priority: 1

    # Trigger 2: Cusp Rule
    # If first or second score has all 4s on I/O/S/C and the other has
    # one 3 and three 4s in these categories, require resolution
    - trigger_id: "cusp_rule"
      type: "pattern_match"
      applies_to_dimensions: ["ideas_content", "organization", "sentence_fluency", "conventions"]
      description: "Cusp rule: 4-4-4-4 vs 3-4-4-4 pattern triggers resolution"
      pattern:
        one_rater_all_scores: [4, 4, 4, 4]
        other_rater_has_one_3_and_three_4s: true
      exclusions: ["voice", "word_choice"]
      action: "invoke_resolution"
      priority: 2

    # Trigger 3: Systematic Adjacent Drift
    # If one rater is exactly one point higher/lower on 3+ traits in the same
    # direction, treat it as a boundary drift and invoke resolution.
    - trigger_id: "systematic_adjacent_drift"
      type: "adjacent_drift"
      applies_to_dimensions: ["*"]
      description: "Three or more adjacent disagreements in the same direction trigger resolution"
      pattern:
        score_gap: 1
        min_matching_dimensions: 3
        require_same_direction: true
      exclusions: []
      action: "invoke_resolution"
      priority: 3

  output_policy:
    preserve_all_candidates: true
    preserve_trigger_reason: true
    preserve_resolution_path: true
    preserve_conflict_metadata: true

  resolution_strategy:
    default: "use_resolution_rater_as_authoritative"
    fallback_if_no_resolution: "average_of_raters"
    re_score_scope: "all_dimensions"

  metadata:
    source_document: "docs/Adjudication_Rules.md"
    version_timestamp: "2026-03-31"
