schema_version: "2.0"

adjudication_policy:
  policy_id: "engineering_eval_adjudication"

  raters:
    required_independent_scores: 2
    rater_labels:
      - "rater_1"
      - "rater_2"
    resolution_rater_label: "rater_3"

  scoring:
    allow_decimal_scores: true
    average_method: "arithmetic"

  triggers:
    - trigger_id: "non_adjacent_dimension_scores"
      type: "score_distance"
      applies_to_dimensions: ["*"]
      description: "任意维度分差大于1时触发裁决"
      threshold:
        operator: ">"
        value: 1
      action: "invoke_resolution"
      priority: 1

    - trigger_id: "systematic_adjacent_drift"
      type: "adjacent_drift"
      applies_to_dimensions: ["*"]
      description: "两个或以上维度在同一方向存在相邻分歧时触发裁决"
      pattern:
        score_gap: 1
        min_matching_dimensions: 2
        require_same_direction: true
      action: "invoke_resolution"
      priority: 2

  resolution_strategy:
    default: "use_resolution_rater_as_authoritative"
    fallback_if_no_resolution: "average_of_raters"
    re_score_scope: "all_dimensions"