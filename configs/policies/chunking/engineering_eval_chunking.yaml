schema_version: "2.0"

chunking_policy:
  policy_id: "engineering_eval_chunking"
  document_processing:
    token_threshold: 4000
    chunk_size_hint: "每个chunk 200-600词，保持对话轮次和主题边界完整"
    pre_split:
      enabled: true
      max_chars_per_segment: 3000
      # strategy 由代码根据 material_context.type 自动推导
    material_strategies:
      conversation: "按对话轮次和主题边界切分，保持完整的问答对，不在单轮对话中间断开"
      code: "按函数、类或模块边界切分，保持逻辑单元完整"
      document: "按段落和章节边界切分，保持论述单元完整"

  extraction_budget:
    # 每次 evidence_extraction 调用允许传入的最大字符数（含所有 chunk 文本）
    # 超出时按均匀采样从全文中选取，保证覆盖率。
    # 131k token 上限，预留 ~8k prompt overhead，约 123k token ≈ 120000 中文字符
    max_chars_per_dimension: 120000