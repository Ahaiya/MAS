schema_version: "2.0"

explanation_policy:
  policy_id: "engineering_eval_explanation"
  policy_version: "v1"
  policy_name: "Engineering Evaluation Explanation"
  description: "Explanations must align with rubric descriptors and cite concrete task evidence"

  requirements:
    require_descriptor_alignment: true
    require_evidence_links: true
    forbid_unreferenced_claims: true
    require_score_citation: true

  render_sections:
    - section_id: "dimension_score"
      type: "score_with_annotation"
      description: "Display the canonical dimension score with optional display annotation"
      fields:
        - "dimension_name"
        - "canonical_score"
        - "display_annotation_optional"

    - section_id: "rubric_alignment"
      type: "descriptor_based_commentary"
      description: "Commentary that explains how observed performance aligns with rubric descriptors"
      requirements:
        - "must quote or paraphrase the relevant rubric descriptors"
        - "must connect each judgment to concrete observed evidence"
        - "must not introduce evaluation criteria outside the rubric"
      template_style: "structured_paragraph"

    - section_id: "evidence_summary"
      type: "artifact_evidence_citations"
      description: "Citations of concrete task artifacts or observed evidence that support the score"
      requirements:
        - "must provide at least minimum_evidence_units per dimension"
        - "must cite concrete artifacts, excerpts, or observable outputs from the submission"
        - "must link each cited evidence item to a specific observation point or rubric descriptor"
        - "may include source locations, artifact identifiers, or span offsets for traceability"

    - section_id: "uncertainty_note"
      type: "conditional_uncertainty"
      description: "Note when confidence is low, evidence coverage is incomplete, or adjudication was required"
      render_when:
        - "observation_confidence_below_threshold"
        - "coverage_gaps_exist"
        - "adjudication_was_required"
      content_style: "caveat_statement"

  citation_rules:
    descriptor_citation_style: "direct_reference"
    evidence_citation_style: "artifact_excerpt_with_context"
    min_citations_per_dimension: 1
    allow_synthetic_summary: false

  display_annotation_policy:
    allow_canonical_only: true
    allow_range_annotations: true  # e.g., "4-", "3-"
    allow_quality_labels: true  # e.g., "High", "Medium", "Low"
    canonical_score_field: "final_score"
    display_annotation_field: "display_annotation"

  output_constraints:
    max_commentary_length_per_dimension: 5000
    require_evidence_score_chain: true
    forbid_free_form_generation: true
    low_confidence_threshold: 0.5

  metadata:
    source_document: "docs/outer_loop_design.md"
    version_timestamp: "2026-04-01"
