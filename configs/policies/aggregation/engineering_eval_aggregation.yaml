schema_version: "2.0"

aggregation_policy:
  policy_id: "engineering_eval_aggregation"
  policy_version: "v2"
  policy_name: "Engineering Evaluation Aggregation Policy"
  description: "三子指标等权重合并为综合能力评分，满分 18 分（3 子指标 × 最高 6 分）。"

  outputs:
    - output_id: "trait_scores"
      type: "dimension_scores"
      description: "三个子指标（A4/B3/F2）的独立得分"
      always_produce: true

    - output_id: "composite_score"
      type: "weighted_sum"
      description: "三子指标等权重综合能力总分（满分 18）"
      always_produce: true

  composite_formula:
    - variant_id: "without_resolution"
      applies_when: "resolution_not_used"
      description: "无裁决时使用 Rater 1 和 Rater 2 各子指标均值"
      source_raters:
        - "rater_1"
        - "rater_2"
      aggregation_method: "average_per_trait_then_weighted_sum"
      weights:
        user_needs_analysis: 1
        solution_generation: 1
        engineering_ethics: 1
      formula_representation: "(A4_R1+A4_R2)/2 + (B3_R1+B3_R2)/2 + (F2_R1+F2_R2)/2"

    - variant_id: "with_resolution"
      applies_when: "resolution_used"
      description: "有裁决时使用 Rater 3 分数"
      source_raters:
        - "rater_3"
      aggregation_method: "average_per_trait_then_weighted_sum"
      weights:
        user_needs_analysis: 1
        solution_generation: 1
        engineering_ethics: 1
      formula_representation: "A4_R3 + B3_R3 + F2_R3"

  notes:
    - "三子指标等权重，满分 18 分"
    - "user_needs_analysis = A4（用户需求与痛点分析）"
    - "solution_generation = B3（解决方案生成与择优）"
    - "engineering_ethics = F2（工程伦理与社会责任）"

  metadata:
    source_document: "configs/rubrics/source/rubric.md"
    version_timestamp: "2026-04-02"
