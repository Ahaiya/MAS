schema_version: "2.0"

dim_id: "d1"
dim_name: "D1 复杂问题的识别和界定"
indicator_description: >
  能够根据复杂工程问题的需求，评估、选择并有效应用合适的技术平台（含AI工具）及工具库（如机器学习框架、数据分析平台、AI辅助设计/仿真工具）；应用适当的AI模型辅助解决问题，并理解其原理和局限性；能够优化工具应用过程乃至进行二次开发。
  

scale:
  type: "ordinal"
  min: 1
  max: 4
  levels:
    4: "优秀"
    3: "良好"
    2: "合格"
    1: "待改进"

dimensions:
  - code: "D1-1"
    name: "工具评估与选择的合理性"
    anchors:
      4: >
        能系统评估多种工具（如OpenCV vs. Scikit-image vs. DeepLabCut）的优劣，并做出有充分理由的最佳选择。
      3: >
        能基于项目需求评估并选择相对合适的工具，并较为详细地说明选择原因。
      2: >
        说明了选择的工具，但选择理由不充分（如“因为大家都用”）。
      1: >
        工具选择随意，未说明理由。

  - code: "D1-2"
    name: "工具运用的熟练度与优化能力"
    anchors:
      4: >
        能深入优化工具应用，通过精细调整多个参数（如HSV阈值范围、形态学核大小、追踪算法参数）或设计预处理策略（如背景减除、光照归一化）来应对复杂条件，显著提升识别鲁棒性。
      3: >
        能熟练运用工具核心功能，成功提取数据，并能进行基本的参数调整。
      2: >
        能使用工具基本功能，但效率低或常遇错误，未进行参数优化。
      1: >
        未能有效使用指定工具（如OpenCV、Tracker）完成基本任务。


  - code: "D1-3"
    name: "工具局限性说明与应对"
    anchors:
      4: >
        能系统分析工具在精度、速度、鲁棒性等多维度的局限性，并设计并实施有效的应对方案，甚至将局限性转化为改进的契机。
      3: >
        能明确指出所用工具的具体局限性，并提出一种可行的应对策略。
      2: >
        能笼统提及工具可能有局限，但无具体分析和应对。
      1: >
        未提及任何工具局限，或认为工具完美无缺。