schema_version: "2.0"

dim_id: "f1"
dim_name: "F1 复杂问题的识别和界定"
indicator_description: >
  能够为自身职业生涯设定清晰、可行的发展目标，并基于此规划、选择和执行有效的学习策略，以持续获取和应用新知识（包含 AI 新技术、伦理规范、应用场景等），并能对学习成效进行反思与调整。
  

scale:
  type: "ordinal"
  min: 1
  max: 4
  levels:
    4: "优秀"
    3: "良好"
    2: "合格"
    1: "待改进"

dimensions:
  - code: "F1-1"
    name: "新知识的自主学习成效"
    anchors:
      4: >
        预习报告不仅掌握了基础知识，还能进行拓展，提出基于新知识的独到见解或初步方案。
      3: >
        预习报告能清晰阐述所学新知识（如OpenCV基本原理）及其与实验任务的关系。
      2: >
        预习报告简单罗列了新知识概念，但未体现理解。
      1: >
        预习报告显示未进行有效学习，或内容与任务无关。

  - code: "F1-2"
    name: "学习规划与反思能力"
    anchors:
      4: >
        能深刻反思自身学习方法的优劣，并制定出一份结合个人职业发展的、有远见的学习路径规划。
      3: >
        能系统总结所学技能，并提出具体、可行的后续学习目标。
      2: >
        能简单列出所学新技能，但无未来规划。
      1: >
        无反思或学习规划。

