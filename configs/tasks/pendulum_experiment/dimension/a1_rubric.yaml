schema_version: "2.0"

dim_id: "a1"
dim_name: "A1 复杂问题的识别和界定"
indicator_description: >
  能够应用数学、科学及工程原理，通过工程观察、初步测试、文献研究等多种途径，识别并分析复杂工程问题的关键要素、变量和相互关系。从多维视角（如技术、社会、环境等）界定问题的研究范围、约束条件与核心需求。关注适合利用AI进行的数据密集、模式识别、多变量优化等环节。

scale:
  type: "ordinal"
  min: 1
  max: 4
  levels:
    4: "优秀"
    3: "良好"
    2: "合格"
    1: "待改进"

dimensions:
  - code: "A1-1"
    name: "关键变量识别的全面性"
    weight: 0.4
    anchors:
      4: >
        能全面识别关键变量，并能分析变量间的相互关系和耦合效应。
      3: >
        能识别3个及以上关键变量，并初步说明其影响。
      2: >
        能识别1-2个关键变量，但未分析其影响。
      1: >
        仅描述单摆运动表面现象，未识别任何关键变量。

  - code: "A1-2"
    name: "问题界定的多维性"
    weight: 0.3
    anchors:
      4: >
        能综合理论、技术、资源等多维度清晰界定问题的研究范围、约束条件及边界。
      3: >
        能从理论假设和技术实现两个维度界定问题的研究范围与约束条件。
      2: >
        提及理论假设或测量技术中的一个维度。
      1: >
        仅从单一理论物理角度描述问题。

  - code: "A1-3"
    name: "核心需求的提炼"
    weight: 0.3
    anchors:
      4: >
        能精准提炼核心需求，并关联到具体应用场景，且能基于核心需求定义成功标准。
      3: >
        能提出明确的核心需求。
      2: >
        提出的核心需求模糊。
      1: >
        未提出核心需求。
