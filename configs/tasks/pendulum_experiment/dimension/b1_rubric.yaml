schema_version: "2.0"

dim_id: "b1"
dim_name: "B1 技术架构和功能模型"
indicator_description: >
  为解决特定工程问题，构建出能够清晰表达解决方案结构、功能和工作原理的概念模型或数学模型。在方案中有效地融合与应用来自不同学科的知识与技术。能够有效利用AI辅助设计工具（如生成式设计、拓扑优化AI）进行模型构建与探索。

scale:
  type: "ordinal"
  min: 1
  max: 4
  levels:
    4: "优秀"
    3: "良好"
    2: "合格"
    1: "待改进"

dimensions:
  - code: "B1-1"
    name: "流程模型的清晰度与完整性"
    weight: 0.3
    anchors:
      4: >
        模型构建精练、严谨，能清晰展示各模块功能、输入输出及数据/信号的转换关系。
      3: >
        清晰、完整，能展示从视频输入到规律输出的完整数据流和处理步骤。
      2: >
        能体现主要环节，但缺乏细节或逻辑连接不清。
      1: >
        模型描述混乱。

  - code: "B1-2"
    name: "多学科知识融合的有效性"
    weight: 0.25
    anchors:
      4: >
        能创造性融合多学科知识，如利用物理规律对AI模型进行约束（添加物理正则化项、使用预训练模型微调）或设计物理信息引导的特征工程，提升方案的科学性与效率。
      3: >
        能较好地将物理原理与计算机技术结合起来解决问题。
      2: >
        提及了物理、编程等多个学科，但它们是割裂的。
      1: >
        方案仅使用单一学科知识。

  - code: "B1-3"
    name: "AI辅助设计工具的运用"
    weight: 0.25
    anchors:
      4: >
        能使用AI工具生成满足多个关联功能需求的代码模块，并能将其系统整合，构成完整的项目解决方案。
      3: >
        能使用AI工具生成满足特定功能需求的代码模块，并能成功整合到项目中。
      2: >
        使用了AI工具，但生成的代码无法正常运行或存在严重逻辑错误。
      1: >
        未使用任何AI工具辅助编程或设计。

  - code: "B1-4"
    name: "流程模型的可复现性"
    weight: 0.2
    anchors:
      4: >
        描述详尽规范，提供了完整的配置文件、依赖列表和示例数据，具备高度的可复现性，体现了严谨的科学工程素养。
      3: >
        描述清晰，包含了必要的参数和软硬件环境说明，他人基本可复现。
      2: >
        描述了主要步骤，但缺少参数、环境等细节，复现难度大。
      1: >
        模型描述缺失关键信息，他人完全无法复现。
