dim_id: "f2"
dim_name: "F2 工程伦理与社会责任"
indicator_description: >
  在工程实践中，能够理解并遵守国家、行业及全球性的工程职业道德、规范和相关法律。
  遵守AI伦理原则（如公平性、透明、问责等）。能够识别并运用伦理框架分析工程实践中的
  伦理困境（包括AI应用中算法偏见、隐私侵犯、自动化决策责任归属等），做出负责任的决策。

scale:
  type: "ordinal"
  min: 1
  max: 5
  levels:
    5: "优秀"
    4: "良好"
    3: "合格"
    2: "接近合格"
    1: "待改进"

dimensions:
  - code: "F2-1"
    name: "伦理问题识别的全面性"
    anchors:
      5: >
        能结合具体场景（如老年人注册、使用、支付、求助等），点出≥2类清晰的伦理风险
        （隐私、数据安全、算法公平、可解释性、误导风险、成瘾性等）；
        明确指出这些风险对老年或其他脆弱群体（如认知障碍、低文化程度、行动不便者）的现实影响；
        对AI给出的风险示例进行筛选和情境化重写，而非简单罗列。
      4: >
        能点出1-2类具体伦理风险，并给出至少一个清楚的使用场景或用户情境；
        对受影响对象有基本说明，但对脆弱群体的特殊困境关注有限。
      3: >
        提到“隐私”“安全”“合规”等风险，但表述笼统无场景，对象不清或混淆；
        多为照搬AI或教材式表述，缺乏与项目情境的结合。
      2: >
        能意识到项目中存在部分伦理风险，也会引用AI提供的风险词汇或案例；
        但风险类型、具体场景和受影响对象仍不够清楚，对脆弱群体的关注较弱。
      1: >
        未能识别出实质性的伦理风险，或仅口号式强调“要注意隐私、安全”；
        完全依赖AI生成的通用内容，没有自己的分析痕迹。

  - code: "F2-2"
    name: "伦理分析框架应用"
    anchors:
      5: >
        明确采用某种权衡框架（如风险×后果、利益-风险平衡、权利-义务分析等），
        说明评估步骤与依据；能指出不同角色（老年用户、家属、平台、开发者等）之间
        谁受益、谁受损，以及短期与长期差异；在AI提示基础上，提出至少1条治理机制
        （如解释与申诉渠道、二次确认、人工复核、限制高风险自动决策等），并说明其适用范围。
      4: >
        有基本的利弊权衡思路，对主要影响对象有清晰描述；
        能提出至少1个与治理相关的改进想法，但分析步骤或论证链条不够完整。
      3: >
        对伦理问题做简单的利弊罗列，但没有清楚的比较标准或权衡方法；
        分析过程零散，缺乏对不同利益相关方的系统考虑。
      2: >
        开始尝试说明伦理选择的利弊，也会参考AI提供的分析框架或治理建议；
        但权衡标准、分析步骤和角色视角仍较模糊，尚未形成完整的论证链条。
      1: >
        基本没有分析过程，仅给出态度性结论（如“我们要尊重用户隐私”）；
        不能说明为何做出某种伦理选择，也未引入任何治理思路。

  - code: "F2-3"
    name: "社会责任意识与落地"
    anchors:
      5: >
        提出≥2条具体、可执行的措施，每条均明确由谁负责、在何时或何种条件下触发、
        如何具体操作（流程、界面、沟通方式等），以及对应的可验证标准
        （如通过率、误报率上限、响应时限、异常工单关闭条件等）；
        能说明这些措施如何降低对老年群体的负担或风险，体现主动承担社会责任，
        而非转嫁给用户。
      4: >
        提出1-2条较为具体的措施（如增加人工客服、增加确认步骤），说明基本执行方式；
        有简单的评估点（如上线前通过测试、用户满意度调研等），但监测与改进机制不够完整。
      3: >
        有一些改进想法，但偏口号化（如“多做宣传”“提高意识”），执行细节和衡量标准缺失；
        AI生成的建议较多，学生对其筛选和本地化不足。
      2: >
        能提出少量社会责任相关措施，也会参考AI给出的改进建议；
        但措施多停留在原则层面，责任分工、触发条件、执行流程或验证标准仍不清晰。
      1: >
        几乎没有针对性的社会责任举措，或提出的措施与项目无关；
        完全停留在“应当做”“应该重视”的价值宣言，没有具体行动方案。
