schema_version: "2.0"

dim_id: "b1"
dim_name: "B1 技术架构和功能模型"
indicator_description: >
  为解决特定工程问题，构建出能够清晰表达解决方案结构、功能和工作原理的概念模型或数学模型。
  在方案中有效地融合与应用来自不同学科的知识与技术。能够有效利用AI辅助设计工具
  （如生成式设计、拓扑优化AI）进行模型构建与探索。

scale:
  type: "ordinal"
  min: 1
  max: 5
  levels:
    5: "优秀"
    4: "良好"
    3: "合格"
    2: "接近合格"
    1: "待改进"

dimensions:
  - code: "B1-1"
    name: "架构逻辑完整性"
    anchors:
      5: >
        能构建多层次系统架构（前端、后端、数据层、AI服务等），模块边界和接口定义清晰；
        数据流向、控制流向、调用关系完整，体现对安全性、性能、可靠性等多约束的综合考虑；
        能利用AI工具对架构进行审查或模拟（如瓶颈分析、故障场景推演），并据此调整设计。
      4: >
        架构总体合理，有清晰的主要模块划分和基本调用关系；局部存在遗漏或模糊
        （如个别接口未说明、异常流程未覆盖）；AI主要用于生成初版架构或参考方案，
        自身对结构合理性有一定判断。
      3: >
        架构较为粗略，模块划分依功能堆叠，逻辑不够连贯；对数据流、异常处理、
        安全控制等关键要素考虑不足；AI生成架构的痕迹明显，但学生对其内在逻辑缺乏理解。
      2: >
        开始尝试搭建整体架构或梳理模块关系，但系统层次、接口定义和关键流程仍较模糊；
        会参考AI生成的架构草案，但对数据流、异常处理或安全约束的理解仍不充分，
        难以支撑稳定实现。
      1: >
        缺乏清晰的整体架构，或仅有零散功能列表；看不出系统层次和模块间关系，
        难以支撑后续实现；严重依赖AI输出，基本没有学生自己的结构化思考。

  - code: "B1-2"
    name: "可持续与维护性设计"
    anchors:
      5: >
        在AI建议和自身分析基础上，提出节能、可扩展、易维护的系统方案
        （如模块化设计、可插拔AI模型、负载均衡策略等）；对长期维护、升级路径、
        版本管理、数据迁移等有明确规划；能识别并说明不同技术选型在能耗、
        成本和维护复杂度之间的权衡。
      4: >
        明确考虑了部分可持续因素（如缓存、模块解耦、日志与监控等）；
        能说明某些设计有利于后续扩展或维护，但整体规划仍偏粗略；
        对AI给出的技术建议能做基本筛选与取舍。
      3: >
        偶尔提到可扩展性或维护性（如“以后可以加新功能”），但缺乏具体机制和路径；
        节能或资源消耗问题几乎未被量化，仅停留在直觉判断。
      2: >
        能意识到后续扩展、维护或资源消耗问题，但多停留在原则性表达；
        会参考AI提出的优化建议，却尚未落实为清晰的模块化、监控、
        升级或资源治理方案。
      1: >
        无可持续性设计考虑，架构明显只针对当前场景“够用即可”；
        完全忽视能耗、资源占用和后续维护成本等长期因素。

  - code: "B1-3"
    name: "AI协同效果评估"
    anchors:
      5: >
        主动调用≥3类不同类型智能体（领域专家AI、用户AI、评估AI等），完成≥3轮
        针对性追问与验证；能对多路AI建议进行比较、整合与反驳，指出其适用条件、
        潜在偏差或盲区；在架构方案中形成独立判断或综合方案，并清晰标记哪些决策
        基于AI、哪些基于自己的工程分析；对话记录体现较强的因果推理、反例检验、
        结果复核等复杂问题求解思维。
      4: >
        有意识地调用2-3个智能体进行架构讨论，存在一定交互；
        能对AI建议作出解释或部分吸收，但对冲突建议的处理较为粗糙；
        架构结论主要依赖AI生成内容，学生的综合分析与批判性思考尚不足。
      3: >
        调用智能体的次数或种类较少，多为单轮问答；大多直接接受AI输出，
        对架构合理性未进行深入追问或验证；对AI建议的理解停留在表面
        （简单复述或照搬）。
      2: >
        会使用AI参与架构思考，但主要停留在少量问答或直接采纳建议；
        能初步回应AI反馈，却缺少比较、反驳或复核过程，人机协同深度有限。
      1: >
        不调用或明显排斥使用AI，或者仅形式上调用后不响应其反馈；
        看不出对AI建议有任何理解、分析或整合；架构内容几乎完全由AI自动生成，
        缺乏人机协同痕迹。
