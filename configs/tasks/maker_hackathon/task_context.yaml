schema_version: "2.0"

task_name: "maker_hackathon"

material_context:
  type: "conversation"
  description: "学生与AI的对话记录，每份材料包含完整对话轮次。"
  evidence_focus: "评价对象是学生本人的输入和分析，不包括AI的回答。若对话中AI复述了学生观点，以学生原始表达为准。"

# 全局评分指引（注入评分阶段）
human_instructions: ""

# 分块阶段指引（注入 chunking 阶段）
chunking_hints: ""

score_anchors: []

# 各维度配置（每项注入对应阶段）
scoring_context:
  - code: "A4-1"
    extraction_hints: ""    # 注入证据提取阶段：告诉提取器重点关注哪类文本
    calibration_notes: "关注学生是否识别出关键问题。关键问题应直接阻碍项目目标或核心功能实现，而非一般性困难。学生仅列出表面现象（如'代码报错'）而未指出根本原因（如'传感器数据格式不匹配'）时，不应给高分。"
    feedback_hints: ""      # 注入反馈生成阶段：告诉反馈生成器侧重什么角度
  - code: "A4-2"
    extraction_hints: ""
    calibration_notes: "关注学生提出的解决方案是否针对已识别的关键问题。解决方案应具体、可操作，并解释如何解决问题。重复描述问题或给出泛泛建议（如'再检查一下'）不属于有效解决方案。解决方案与问题之间的逻辑链条必须清晰。"
    feedback_hints: ""
  - code: "A4-3"
    extraction_hints: ""
    calibration_notes: "关注学生是否评估了解决方案的潜在影响和风险。评估需超越'可能有用'，应具体说明对项目进度、功能或团队协作的积极/消极影响，或识别实施中的主要障碍。简单赞同某个方案而无分析，不属于有效评估。"
    feedback_hints: ""
