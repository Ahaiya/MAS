dim_id: "f2"
dim_name: "F2 工程伦理与社会责任"
indicator_description: >
  在工程实践中，能够理解并遵守国家、行业及全球性的工程职业道德、规范和相关法律。遵守AI伦理原则（如公平性、透明、问责等）。能够识别并运用伦理框架分析工程实践中的伦理困境（包括AI应用中算法偏见、隐私侵犯、自动化决策责任归属等），做出负责任的决策。

scale:
  type: "ordinal"
  min: 1
  max: 4
  levels:
    4: "优秀"
    3: "良好"
    2: "合格"
    1: "待改进"

dimensions:
  - code: "F2-1"
    name: "数据真实性与学术诚信"
    weight: 0.4
    anchors:
      4: >
        不仅保证了数据真实性，还能主动讨论数据造假对科研和工程实践的危害。
      3: >
        数据记录原始、完整，所有数据点均被保留，并如实报告了异常值。
      2: >
        数据基本真实，但可能存在选择性报告（删除了"不好"的数据点）且未说明。
      1: >
        存在数据伪造或抄袭的严重问题。

  - code: "F2-2"
    name: "对AI伦理问题的认知"
    weight: 0.6
    anchors:
      4: >
        能深入讨论AI在科学发现中的角色、责任归属（如果AI发现了一个"新规律"，谁为它的正确性负责？）等深刻伦理问题。
      3: >
        能识别出本实验中AI使用的具体伦理问题，如"AI模型可能从有偏的数据中学习到错误的物理规律"。
      2: >
        能笼统提及AI可能犯错，但未深入。
      1: >
        未识别任何与AI相关的伦理问题。
