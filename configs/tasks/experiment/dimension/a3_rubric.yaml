dim_id: "a3"
dim_name: "A3 批判性思维与自我反思"
indicator_description: >
  在问题解决全过程中，持续地对信息来源、分析方法及初步结论进行批判性评估。同时，对自身的思考和问题解决过程进行监控、评估和调整。能认识到AI生成内容的潜在偏差与局限性（如训练数据时效性），明确其作为辅助（原料）与个人创造（产出）之间的区别，保持自身专业判断的独立性。

scale:
  type: "ordinal"
  min: 1
  max: 4
  levels:
    4: "优秀"
    3: "良好"
    2: "合格"
    1: "待改进"

dimensions:
  - code: "A3-1"
    name: "对理论与方法的批判性质疑"
    weight: 0.4
    anchors:
      4: >
        能提出合理的验证思路或改进方向，以弥补理论与现实之间的差距，展现主动改进的意识。
      3: >
        能明确指出理论的关键假设及其在现实中的不成立之处，并能分析测量方法的局限性。
      2: >
        能提及理论存在假设，或方法存在误差，但未深入分析。
      1: >
        全盘接受理论与方法，未提出任何质疑。

  - code: "A3-2"
    name: "对AI模型输出的辩证认识"
    weight: 0.3
    anchors:
      4: >
        能理解AI在科学发现中的角色边界，尝试阐述AI输出与物理理论之间的根本差异，并能提出一种独立于该AI模型的物理验证策略（如设计新实验），体现对AI本质的批判性认识。
      3: >
        能指出AI模型只是对数据的数学逼近，其"规律"未必有物理意义，并至少提出一个可能导致AI结果不可靠的具体原因（如：数据噪声大、变量缺失、过拟合、外推不可靠等）。
      2: >
        能意识到AI拟合可能存在误差，但无法具体说明误差来源或物理意义问题。
      1: >
        完全信任AI拟合结果，将其视为"真实规律"，未意识到其局限性。

  - code: "A3-3"
    name: "反思的深度与改进意识"
    weight: 0.3
    anchors:
      4: >
        能基于本次实验反思，提出一套可迁移至同类研究任务的通用改进策略或标准化流程，并阐明其普适价值。
      3: >
        能系统分析实验的主要误差来源，并提出至少一项具体的改进措施。
      2: >
        能指出实验中的不足，但无具体改进方向。
      1: >
        无反思或反思流于形式。
