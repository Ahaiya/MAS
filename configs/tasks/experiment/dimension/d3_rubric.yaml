dim_id: "d3"
dim_name: "D3 获取、分析与解释数据"
indicator_description: >
  能够设计并执行适当的实验方案，以科学、规范的方式收集研究所需的数据。为训练/验证AI模型设计数据采集方案（考虑数据规模、质量、多样性、标注需求）。规范数据采集过程。对数据进行整理、分析和解释，并利用工程判断从中得出合理、有效的结论。能够分析、解释AI模型输出结果的含义、不确定性及其对工程决策的支持作用。

scale:
  min: 1
  max: 4
  levels:
    4: "优秀"
    3: "良好"
    2: "合格"
    1: "待改进"

dimensions:
  - code: "D3-1"
    name: "数据采集方案的规范性与完备性"
    weight: 0.25
    anchors:
      4: >
        方案科学、系统，充分考虑了数据规模（足够多周期）、多样性（多种条件）和可复现性（详细记录所有参数），并采集了用于验证的测试集。
      3: >
        方案考虑了变量控制（如记录多种摆长、初始角），数据记录规范（有时间、环境等元数据）。
      2: >
        方案简单，如只记录了一种摆长下的数据。
      1: >
        未设计采集方案，数据零散。

  - code: "D3-2"
    name: "数据处理的规范性与分析深度"
    weight: 0.25
    anchors:
      4: >
        能运用专业方法（如FFT分析频谱）深入挖掘数据特征，或使用复杂AI模型（如符号回归）探索运动方程，分析有深度。
      3: >
        能对数据进行规范处理（如滤波、去趋势），并进行可视化（如绘制角度－时间图），开展初步的定量分析（如拟合振幅衰减）。
      2: >
        仅进行了简单的数据整理（如计算平均周期）。
      1: >
        未对数据进行有效处理，或处理有误。

  - code: "D3-3"
    name: "数据解释与结论的有效性"
    weight: 0.3
    anchors:
      4: >
        能科学解释数据，得出深刻结论，并清晰阐述结论的适用范围、不确定性和对改进物理模型的启示。
      3: >
        能合理解释数据，将AI拟合出的参数（如阻尼系数）与物理意义关联，并得出有效结论（如"阻尼系数与摆长成反比"）。
      2: >
        结论基本基于数据，但解释流于表面，未触及物理本质。
      1: >
        结论与数据无关或明显错误。

  - code: "D3-4"
    name: "结论的可重复性检验"
    weight: 0.2
    anchors:
      4: >
        能系统设计可重复性检验方案（如交叉验证、重复实验取多组数据对比），定量评估结论的稳定性，并讨论导致不可重复的潜在因素。
      3: >
        能采用简单方法检验可重复性（如"将数据分为训练集和测试集，验证结论在测试集上是否成立"）。
      2: >
        能意识到结论需要检验，但方法粗糙。
      1: >
        未进行任何可重复性检验，或仅用单次数据得出结论。
