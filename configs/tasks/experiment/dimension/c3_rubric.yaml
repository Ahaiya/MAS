dim_id: "c3"
dim_name: "C3 多源信息整合与审慎决策"
indicator_description: >
  能够将数据分析与专业经验、逻辑推理相结合，作出工程判断和决策，并清晰阐述其决策逻辑。能够批判性地利用AI模型（如预测模型、诊断模型、优化模型）辅助决策，并理解其不确定性。

scale:
  type: "ordinal"
  min: 1
  max: 4
  levels:
    4: "优秀"
    3: "良好"
    2: "合格"
    1: "待改进"

dimensions:
  - code: "C3-1"
    name: "信息整合的广度与深度"
    weight: 0.4
    anchors:
      4: >
        能系统整合多源信息，并揭示其内在联系（如发现AI拟合的残差与视频中的背景噪声有关），为深入决策提供坚实依据。
      3: >
        能有效整合理论公式、多组实测数据和AI拟合结果，共同支撑一个结论。
      2: >
        整合了理论和实测数据，但两者矛盾时无法有效处理。
      1: >
        决策仅基于单一来源（如仅看理论值或仅看一个数据点）。

  - code: "C3-2"
    name: "决策逻辑与风险评估"
    weight: 0.3
    anchors:
      4: >
        能清晰阐述权衡过程（如"为获得更平滑的曲线，我们放弃了部分原始数据点，这可能导致振幅信息的轻微损失"），决策审慎。
      3: >
        能清晰阐述决策逻辑，并识别出决策可能带来的风险（如"我们选择多项式拟合，但风险是过拟合"）。
      2: >
        说明了决策理由，但逻辑不清，未考虑风险。
      1: >
        未说明决策理由。

  - code: "C3-3"
    name: "对AI模型输出的批判性使用"
    weight: 0.3
    anchors:
      4: >
        能系统评估AI输出的可靠性，并明确制定使用规则：在何种条件下可以信赖AI输出并用于决策，在何种条件下需要拒绝或修正后再使用（例如"当R²>0.99且残差无系统偏差时采用AI预测的周期，否则返回理论公式"），并尝试说明这种规则背后的工程判断依据。
      3: >
        能根据AI输出的置信度或误差范围（如拟合标准差、预测区间），在决策中有区分地使用（如误差小时直接使用，误差大时仅作为参考或降低权重）。
      2: >
        能口头提及AI输出可能有误差，但在实际决策中仍直接使用，未采取任何调整措施。
      1: >
        直接使用AI输出作为最终结论，未考虑其可靠性或不确定性。
