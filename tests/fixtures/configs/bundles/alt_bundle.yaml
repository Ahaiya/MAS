# Alternative Bundle (for zero-hardcoding firewall tests)
# Intentionally different from baseline: 3 dims, 1-4 scale, equal weights,
# no range annotations, stricter adjudication threshold

schema_version: "2.0"

artifact_bundle:
  bundle_id: "alt_3dim_bundle"
  bundle_version: "v1-test"
  bundle_name: "Alternative 3-Dimension Bundle"
  description: "Alternative bundle for zero-hardcoding firewall tests"

  rubric_core_ref: "rubric://alt_3dim_rubric/v1"
  rubric_source_file: "rubrics/alt_rubric.yaml"

  adjudication_policy_ref: "policy://alt_simple_adjudication/v1"
  adjudication_source_file: "policies/adjudication/alt_adjudication.yaml"

  aggregation_policy_ref: "policy://alt_equal_weights/v1"
  aggregation_source_file: "policies/aggregation/alt_aggregation.yaml"

  explanation_policy_ref: "explain://alt_simple_explanation/v1"
  explanation_source_file: "policies/explanation/alt_explanation.yaml"

  prompt_templates:
    - "prompts/alt_extraction.yaml"

  freeze_hash: "TBD"
  freeze_timestamp: "2026-03-12"

  source_documents:
    - "tests/fixtures/configs/rubrics/alt_rubric.yaml"

  validation_rules:
    - rule_id: "all_refs_resolvable"
      type: "reference_resolution"
      description: "All artifact references must resolve to existing files"

  metadata:
    purpose: "zero_hardcoding_firewall_test"
    baseline_compatible: false
