# Alternative Adjudication Policy (for zero-hardcoding firewall tests)
# Intentionally different: threshold > 2 (stricter), no cusp rule, different rater labels

schema_version: "2.0"

adjudication_policy:
  policy_id: "alt_simple_adjudication"
  policy_version: "v1"
  policy_name: "Simple Alternative Adjudication"
  description: "Alternative adjudication with stricter threshold (>2) for firewall testing"

  raters:
    required_independent_scores: 2
    rater_labels:
      - "rater_a"
      - "rater_b"
    optional_resolution_rater: 1
    resolution_rater_label: "rater_c"

  triggers:
    - trigger_id: "large_disagreement"
      type: "score_distance"
      applies_to_dimensions: ["*"]
      description: "Invoke resolution when raters disagree by more than 2 points"
      threshold:
        operator: ">"
        value: 2
      action: "invoke_resolution"
      priority: 1

  output_policy:
    preserve_all_candidates: true
    preserve_trigger_reason: true
    preserve_resolution_path: false
    preserve_conflict_metadata: true

  resolution_strategy:
    default: "average_of_raters"
    fallback_if_no_resolution: "use_higher_score"

  metadata:
    purpose: "zero_hardcoding_firewall_test"
