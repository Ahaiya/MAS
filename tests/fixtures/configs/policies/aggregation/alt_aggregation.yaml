# Alternative Aggregation Policy (for zero-hardcoding firewall tests)
# Intentionally different: all dimensions have equal weight 1 (baseline uses 0/2/4)

schema_version: "2.0"

aggregation_policy:
  policy_id: "alt_equal_weights"
  policy_version: "v1"
  policy_name: "Equal Weight Aggregation"
  description: "All dimensions weighted equally for firewall testing"

  outputs:
    - output_id: "dimension_scores"
      type: "dimension_scores"
      description: "Individual scores for all dimensions"
      always_produce: true
    - output_id: "composite_score"
      type: "weighted_sum"
      description: "Equal-weight composite score"
      always_produce: true

  composite_formula:
    - variant_id: "equal_weights_all"
      applies_when: "always"
      description: "All three dimensions carry equal weight of 1"
      source_raters: ["rater_a", "rater_b"]
      aggregation_method: "average_per_trait_then_weighted_sum"
      weights:
        alpha: 1
        beta: 1
        gamma: 1
      formula_representation: "A + B + G"

  metadata:
    purpose: "zero_hardcoding_firewall_test"
