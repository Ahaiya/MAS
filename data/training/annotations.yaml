# 工程评估训练集标注数据
# 30组学生AI协同项目对话记录 + 2位人类专家打分
# 量表：1-5分，各维度含3个观测点

metadata:
  name: "工程评估训练集"
  description: "30组学生与AI对话记录，涵盖智慧助老产品设计全流程，由2位专家按4个维度12个观测点独立打分"
  scale: "1-5（1=待改进，2-3=合格，3-4=良好，4-5=优秀）"
  rubric_source: "configs/rubrics/tasks/engineering_eval_task_rubric.yaml"
  total_groups: 30
  double_coded_groups: 22  # 第2/4/6/10/13/14/20/21组仅有编码者1评分

dimensions:
  A4:
    name: "用户需求分析"
    raw_weight: 0.069
    normalized_weight: 0.3382
    sub_indicators:
      - id: "A4-1"
        name: "用户群体识别的全面性"
      - id: "A4-2"
        name: "痛点定位与需求精准度"
      - id: "A4-3"
        name: "AI协同与伦理反思"
  B1:
    name: "技术架构与功能模型"
    raw_weight: 0.06
    normalized_weight: 0.2941
    sub_indicators:
      - id: "B1-1"
        name: "架构逻辑完整性"
      - id: "B1-2"
        name: "可持续与维护性设计"
      - id: "B1-3"
        name: "AI协同效果评估"
  C2:
    name: "潜在风险识别与应对策略"
    raw_weight: 0.038
    normalized_weight: 0.1863
    sub_indicators:
      - id: "C2-1"
        name: "风险识别全面性"
      - id: "C2-2"
        name: "应对策略科学性"
      - id: "C2-3"
        name: "风险量化与监控"
  F2:
    name: "工程伦理与社会责任"
    raw_weight: 0.037
    normalized_weight: 0.1814
    sub_indicators:
      - id: "F2-1"
        name: "伦理问题识别的全面性"
      - id: "F2-2"
        name: "伦理分析框架应用"
      - id: "F2-3"
        name: "社会责任意识与落地"

